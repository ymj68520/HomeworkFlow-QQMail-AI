# Attachment validation preset categories configuration
# Users can modify these presets to customize allowed file types

categories:
  document:
    display_name: "文档类型"
    extensions:
      - .pdf
      - .doc
      - .docx
      - .xls
      - .xlsx
      - .ppt
      - .pptx
      - .txt

  image:
    display_name: "图片类型"
    extensions:
      - .png
      - .jpg
      - .jpeg
      - .gif
      - .bmp
      - .webp

  archive:
    display_name: "压缩文件"
    extensions:
      - .zip
      - .rar
      - .7z
      - .tar
      - .gz

default_enabled_categories:
  - document
  - image
  - archive

default_size_limits:
  max_file_size_mb: 25
  max_total_size_mb: 100
